# Deploy individual no Dokploy (serviço Compose).
# NEXT_PUBLIC_API_URL é build-time: defina como build arg no Dokploy.
services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    image: orbit-crm-frontend
    container_name: orbit-crm-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
